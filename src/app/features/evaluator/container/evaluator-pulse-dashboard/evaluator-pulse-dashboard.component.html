<div class="pulse-insight-dashboard" data-role="evaluator">
  <div class="pulse-ambient" aria-hidden="true"></div>

  <ng-container *ngIf="!isPageLoader">
    <section class="pulse-summary-row" *ngIf="summaryCards?.length">
      <article
        class="pulse-summary-card"
        *ngFor="let card of summaryCards; trackBy: trackByTitle; let i = index"
        [style.animation-delay]="i * 80 + 'ms'"
        [attr.data-accent]="card.accent || 'blue'">
        <div class="pulse-summary-icon">
          <i class="bi" [ngClass]="card.icon"></i>
        </div>
        <div class="pulse-summary-body">
          <span class="pulse-summary-title">{{ card.title }}</span>
          <strong class="pulse-summary-value">{{ card.value }}</strong>
          <span class="pulse-summary-sub">{{ card.subtitle }}</span>
        </div>
      </article>
    </section>

    <section class="pulse-toolbar">
      <div class="pulse-toolbar-left">
        <span class="pulse-role-badge">Evaluator</span>
        <div class="pulse-select-wrap">
          <label>Select Program</label>
          <ng-select
            [items]="programs || []"
            [searchable]="true"
            [searchFn]="customSearchFn"
            [placeholder]="!selectedPrograms ? 'Select Program' : ''"
            [(ngModel)]="selectedPrograms"
            (ngModelChange)="onProgramChange()"
            bindValue="climateProgramID"
            bindLabel="programName"
            class="pulse-ng-select">
            <ng-template ng-option-tmp let-item="item">
              {{ item.programName }}<span *ngIf="item.location">, {{ item.location }}</span><span *ngIf="item.year"> · {{ item.year }}</span>
            </ng-template>
          </ng-select>
        </div>
      </div>
      <div class="pulse-toolbar-actions">
        <button
          type="button"
          class="pulse-btn pulse-btn--blue"
          matTooltip="Export pillar details"
          (click)="exportProgramPillar()">
          Export
          <i class="bi bi-upload"></i>
        </button>
      </div>
    </section>

    <section class="pulse-charts-row">
      <div class="pulse-panel pulse-panel--performance">
        <div class="pulse-panel-head">
          <h3>Manual Score Overview</h3>
          <div class="pulse-legend">
            <span class="pulse-legend-item"><i class="dot dot-blue"></i> Manual Score</span>
          </div>
        </div>
        <div class="pulse-chart-wrap" *ngIf="pillarChartOptions?.series?.length; else emptyPillar">
          <apx-chart
            [series]="pillarChartOptions!.series!"
            [chart]="pillarChartOptions!.chart!"
            [xaxis]="pillarChartOptions!.xaxis!"
            [yaxis]="pillarChartOptions!.yaxis!"
            [colors]="pillarChartOptions!.colors!"
            [tooltip]="pillarChartOptions!.tooltip!"
            [plotOptions]="pillarChartOptions!.plotOptions || {}"
            [legend]="pillarChartOptions!.legend!"
            [fill]="pillarChartOptions!.fill || {}"
            [dataLabels]="pillarChartOptions!.dataLabels!"
            [stroke]="pillarChartOptions!.stroke!"
            [markers]="pillarChartOptions!.markers!"
            [grid]="pillarChartOptions!.grid!">
          </apx-chart>
        </div>
        <ng-template #emptyPillar>
          <div class="pulse-empty">Select a program to view performance scores.</div>
        </ng-template>
      </div>

      <div class="pulse-panel pulse-panel--overview">
        <div class="pulse-panel-head">
          <h3>Program Overview</h3>
        </div>
        <div class="pulse-chart-wrap" *ngIf="radialChartOptions?.series?.length; else emptyRadial">
          <apx-chart
            [series]="radialChartOptions!.series!"
            [chart]="radialChartOptions!.chart!"
            [plotOptions]="radialChartOptions!.plotOptions!"
            [labels]="radialChartOptions!.labels!"
            [legend]="radialChartOptions!.legend!"
            [colors]="radialChartOptions!.colors!">
          </apx-chart>
        </div>
        <ng-template #emptyRadial>
          <div class="pulse-empty">Program overview will appear here.</div>
        </ng-template>
      </div>
    </section>

  </ng-container>

  <div *ngIf="isPageLoader" class="loader_main">
    <div class="loader"></div>
  </div>
</div>
